name: Build Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to read-only — build checks need no write access
permissions:
  contents: read

jobs:
  # ── 1. TypeScript compile check ───────────────────────────────────────────
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  # ── 2. JS bundle check (Metro / Expo) ─────────────────────────────────────
  bundle:
    name: JS Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export bundle (catches Metro / JS compile errors)
        run: npx expo export --platform android --no-minify
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: 1

  # ── 3. Android Gradle build check ─────────────────────────────────────────
  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Gradle home keyed on package-lock.json (exists at checkout).
      # android/ is generated by expo prebuild later, so setup-java's built-in
      # gradle cache can't be used — it requires the Gradle files to already exist.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: 1

      - name: Gradle build check (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          JAVA_OPTS: -Xmx4g
